<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(() => {
        let theme
        try {
          const storedTheme = localStorage.getItem('edge-theme')
          if (storedTheme === 'dark' || storedTheme === 'light') theme = storedTheme
        } catch {}
        if (!theme) theme = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta
      name="description"
      content="Edge 平台面向矿山装备企业，提供可视化组态、实时数据连接与开放集成能力。"
    />
    <title>Edge平台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
