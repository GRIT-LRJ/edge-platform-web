<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Edge 平台开放集成组态画布</title>
  <desc id="desc">边缘服务器挂接应用、CAN 与 TCP 驱动节点，通过加号持续扩展新驱动与模块的动态组态画布。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1420"/><stop offset="1" stop-color="#0c1c2c"/></linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4da3ff"/><stop offset="1" stop-color="#3ce2c5"/></linearGradient>
    <radialGradient id="haloGreen"><stop stop-color="#b8ffbe" stop-opacity=".16"/><stop offset="1" stop-color="#b8ffbe" stop-opacity="0"/></radialGradient>
    <radialGradient id="haloBlue"><stop stop-color="#4da3ff" stop-opacity=".10"/><stop offset="1" stop-color="#4da3ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#5bd7df" stroke-opacity=".07"/></pattern>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif}.mono{font-family:ui-monospace,Consolas,monospace}</style>
  </defs>

  <!-- ===== 画布与背景 ===== -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="480" cy="420" rx="380" ry="250" fill="url(#haloBlue)" opacity=".7"/>
  <rect x="0" y="92" width="1600" height="908" fill="url(#grid)"/>

  <!-- ===== 编辑器顶栏 ===== -->
  <rect x="0" y="0" width="1600" height="52" fill="#0b1626"/>
  <rect x="0" y="52" width="1600" height="40" fill="#0e1d30"/>
  <rect x="0" y="91" width="1600" height="1" fill="#173049"/>
  <path d="M28 18l12 8-12 8-12-8z" fill="url(#logo)"/>
  <text x="54" y="34" font-size="22" font-weight="700" fill="#eaf6ff">DrillMind</text>
  <g font-size="16" fill="#b6cadd">
    <text x="214" y="32">保存工程</text><text x="312" y="32">编译工程</text><text x="410" y="32">启动工程</text><text x="508" y="32">上传资产</text><text x="606" y="32">关于</text><text x="668" y="32">帮助</text>
  </g>
  <rect x="1414" y="10" width="112" height="32" rx="6" fill="#2f8f5b"/>
  <text x="1470" y="31" font-size="15" font-weight="700" fill="#eafff4" text-anchor="middle">下载运行时</text>
  <g fill="#22314a"><rect x="1544" y="14" width="20" height="20" rx="5"/><rect x="1570" y="14" width="20" height="20" rx="5"/></g>
  <text x="16" y="78" font-size="17" font-weight="700" fill="#e6f7ff">设备</text>
  <rect x="12" y="60" width="52" height="3" rx="1.5" fill="#4de0c9"/>
  <g font-size="16" fill="#9db3c6">
    <text x="96" y="78">显示</text><text x="162" y="78">放大</text><text x="230" y="78">缩小</text><text x="298" y="78">还原</text>
  </g>

  <!-- ===== 边缘服务器光晕与扩散波纹 ===== -->
  <ellipse cx="599" cy="366" rx="270" ry="170" fill="url(#haloGreen)">
    <animate attributeName="opacity" values=".55;.95;.55" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="599" cy="366" r="70" fill="none" stroke="#a9d977" stroke-width="2">
    <animate attributeName="r" values="70;225" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="599" cy="366" r="70" opacity="0" fill="none" stroke="#a9d977" stroke-width="2">
    <animate attributeName="r" values="70;225" dur="5s" begin="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;0" dur="5s" begin="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== 应用 → 边缘服务器（蓝色链路） ===== -->
  <g fill="none" stroke="#4d9fff" stroke-width="2.5" stroke-dasharray="10 16">
    <path d="M474 204L486 300"><animate attributeName="stroke-dashoffset" values="0;-520" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.05;0.17;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M648 204L522 300"><animate attributeName="stroke-dashoffset" values="0;-520" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.08;0.20;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M814 204L558 300"><animate attributeName="stroke-dashoffset" values="0;-520" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.11;0.23;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M953 204L594 300"><animate attributeName="stroke-dashoffset" values="0;-520" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.14;0.26;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M1100 204L630 300"><animate attributeName="stroke-dashoffset" values="0;-520" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.17;0.29;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M1260 204L666 300"><animate attributeName="stroke-dashoffset" values="0;-520" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.20;0.32;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M1376 204L702 300"><animate attributeName="stroke-dashoffset" values="0;-520" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.23;0.35;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
  </g>
  <text x="556" y="286" font-size="14" fill="#6fb7ff">应用</text>

  <!-- 链路光点 -->
  <g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.09;0.80;0.85;1" dur="10s" repeatCount="indefinite"/><circle r="5" fill="#8fd1ff" filter="url(#glow)"><animateMotion dur="2.5s" repeatCount="indefinite" path="M474 204L486 300"/></circle></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14;0.18;0.80;0.85;1" dur="10s" repeatCount="indefinite"/><circle r="5" fill="#8fd1ff" filter="url(#glow)"><animateMotion dur="2.5s" repeatCount="indefinite" path="M953 204L594 300"/></circle></g>
    <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.23;0.27;0.80;0.85;1" dur="10s" repeatCount="indefinite"/><circle r="5" fill="#8fd1ff" filter="url(#glow)"><animateMotion dur="2.5s" repeatCount="indefinite" path="M1376 204L702 300"/></circle></g>
  </g>

  <!-- ===== CAN 链路（紫色） ===== -->
  <g fill="none" stroke="#a678f0" stroke-width="2.5" stroke-dasharray="10 14">
    <path d="M528 432V470"><animate attributeName="stroke-dashoffset" values="0;-480" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.26;0.40;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M664 432V470"><animate attributeName="stroke-dashoffset" values="0;-480" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.30;0.44;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M664 510V560H528"><animate attributeName="stroke-dashoffset" values="0;-480" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.32;0.46;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M528 510V852"><animate attributeName="stroke-dashoffset" values="0;-480" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.27;0.44;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M528 570H640"><animate attributeName="stroke-dashoffset" values="0;-240" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.31;0.45;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M528 662H640"><animate attributeName="stroke-dashoffset" values="0;-240" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.34;0.48;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M528 754H640"><animate attributeName="stroke-dashoffset" values="0;-240" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.37;0.51;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M444 570H528" stroke-dasharray="6 8" stroke="#7f93ad" opacity="0.55"/>
  </g>
  <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.31;0.80;0.85;1" dur="10s" repeatCount="indefinite"/><circle r="5" fill="#c9a4ff" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M528 510V852"/></circle></g>

  <!-- ===== TCP 网关链路（橙色） ===== -->
  <g fill="none" stroke="#e8a33d" stroke-width="2.5" stroke-dasharray="10 14">
    <path d="M748 362H884V696"><animate attributeName="stroke-dashoffset" values="0;-480" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.50;0.66;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M884 402H926"><animate attributeName="stroke-dashoffset" values="0;-240" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.52;0.66;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M884 484H926"><animate attributeName="stroke-dashoffset" values="0;-240" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.55;0.69;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M884 572H926"><animate attributeName="stroke-dashoffset" values="0;-240" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.58;0.72;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M884 660H926"><animate attributeName="stroke-dashoffset" values="0;-240" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.61;0.75;0.82;0.95;1" dur="10s" repeatCount="indefinite"/></path>
    <path d="M884 754H926" stroke-dasharray="6 8" stroke="#c98a3f" opacity="0.55"/>
  </g>
  <g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.54;0.80;0.85;1" dur="10s" repeatCount="indefinite"/><circle r="5" fill="#ffd08a" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M748 362H884V696"/></circle></g>

  <!-- ===== 顶部应用节点 ===== -->
  <g fill="#16243f" stroke="#45a1ff" stroke-width="1.5">
    <rect x="392" y="144" width="164" height="60" rx="8"/>
    <rect x="574" y="144" width="148" height="60" rx="8"/>
    <rect x="740" y="144" width="148" height="60" rx="8"/>
    <rect x="906" y="144" width="94" height="60" rx="8"/>
    <rect x="1018" y="144" width="164" height="60" rx="8"/>
    <rect x="1200" y="144" width="120" height="60" rx="8"/>
    <rect x="1338" y="144" width="76" height="60" rx="8"/>
  </g>
  <g font-size="20" fill="#e8f4ff" text-anchor="middle">
    <text x="474" y="181">车载操作软件</text>
    <text x="648" y="181">历史版本备份</text>
    <text x="814" y="181">软硬件监控</text>
    <text x="953" y="181">设置</text>
    <text x="1100" y="181">视频显示应用</text>
    <text x="1260" y="181">显示应用</text>
    <text x="1376" y="181" class="mono">share</text>
  </g>

  <!-- 应用侧虚线加号 -->
  <g>
    <animate attributeName="opacity" values=".5;.95;.5" dur="5s" repeatCount="indefinite"/>
    <rect x="1432" y="144" width="64" height="60" rx="8" fill="none" stroke="#55687f" stroke-width="1.5" stroke-dasharray="7 7"/>
    <path d="M1464 162v24M1452 174h24" stroke="#7d92ab" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ===== 边缘服务器 ===== -->
  <rect x="450" y="300" width="298" height="132" rx="14" fill="#24402e" stroke="#a9d977" stroke-width="2"/>
  <text x="599" y="355" font-size="30" font-weight="700" fill="#f2ffe9" text-anchor="middle">边缘服务器</text>
  <text x="599" y="390" font-size="13" fill="#9fd2a0" text-anchor="middle" letter-spacing=".12em" class="mono">EDGE RUNTIME · 组态运行</text>

  <!-- ===== TCP 网关 ===== -->
  <circle cx="766" cy="318" r="4" fill="#e8a33d" filter="url(#glow)"/>
  <text x="776" y="324" font-size="17" font-weight="700" fill="#e8a33d" class="mono">TCP网关</text>

  <!-- ===== 右侧 TCP 驱动节点 ===== -->
  <g>
    <rect x="926" y="372" width="150" height="60" rx="8" fill="#1d2334" stroke="#7f93ad" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="1001" y="409" font-size="17" fill="#93a7c0" text-anchor="middle" class="mono">Empty</text>
  </g>
  <g fill="#1d2334" stroke="#e8a33d" stroke-width="1.5">
    <rect x="926" y="448" width="150" height="72" rx="8"/>
    <rect x="926" y="536" width="150" height="72" rx="8"/>
    <rect x="926" y="624" width="150" height="72" rx="8"/>
  </g>
  <g class="mono">
    <text x="942" y="478" font-size="14" fill="#d7a86a">DRV_CanOpen-</text>
    <text x="942" y="504" font-size="18" font-weight="700" fill="#fff2df">Sim</text>
    <text x="942" y="566" font-size="14" fill="#d7a86a">DRV_Drill-</text>
    <text x="942" y="592" font-size="18" font-weight="700" fill="#fff2df">Plan</text>
    <text x="942" y="654" font-size="14" fill="#d7a86a">DRV_Lidar-</text>
    <text x="942" y="680" font-size="18" font-weight="700" fill="#fff2df">Drill</text>
  </g>

  <!-- TCP 侧虚线加号（呼吸） -->
  <g>
    <animate attributeName="opacity" values=".5;.95;.5" dur="5s" repeatCount="indefinite"/>
    <rect x="926" y="720" width="70" height="68" rx="8" fill="none" stroke="#55687f" stroke-width="1.5" stroke-dasharray="7 7"/>
    <path d="M961 738v32M945 754h32" stroke="#7d92ab" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ===== CAN 总线条与节点 ===== -->
  <g fill="#372d63" stroke="#a678f0" stroke-width="1.5">
    <rect x="470" y="470" width="116" height="40" rx="6"/>
    <rect x="606" y="470" width="116" height="40" rx="6"/>
  </g>
  <text x="528" y="498" font-size="19" font-weight="700" fill="#f3edff" text-anchor="middle" class="mono">CAN2</text>
  <text x="664" y="498" font-size="19" font-weight="700" fill="#f3edff" text-anchor="middle" class="mono">CAN1</text>
  <circle cx="528" cy="560" r="4" fill="#a678f0"/>

  <g fill="#20203a" stroke="#a678f0" stroke-width="1.5">
    <rect x="640" y="538" width="150" height="64" rx="8"/>
    <rect x="640" y="630" width="150" height="64" rx="8"/>
    <rect x="640" y="722" width="150" height="64" rx="8"/>
  </g>
  <g class="mono">
    <text x="656" y="566" font-size="14" fill="#a78fd8">DRV_CanOpen-</text>
    <text x="656" y="590" font-size="18" font-weight="700" fill="#f1eaff">DTP</text>
    <text x="656" y="658" font-size="14" fill="#a78fd8">DRV_CanOpen-</text>
    <text x="656" y="682" font-size="18" font-weight="700" fill="#f1eaff">DrillArm</text>
    <text x="656" y="750" font-size="14" fill="#a78fd8">DRV_CanOpen-</text>
    <text x="656" y="774" font-size="18" font-weight="700" fill="#f1eaff">Power</text>
  </g>

  <!-- CAN 侧虚线加号（呼吸） -->
  <g>
    <animate attributeName="opacity" values=".5;.95;.5" dur="5s" repeatCount="indefinite"/>
    <rect x="372" y="536" width="70" height="68" rx="8" fill="none" stroke="#55687f" stroke-width="1.5" stroke-dasharray="7 7"/>
    <path d="M407 554v32M391 570h32" stroke="#7d92ab" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ===== 扩展演示组：加号 → 新驱动卡片 → 加号（10s 循环） ===== -->
  <g>
    <!-- 底部加号：扩展开始时淡出，循环末尾复位 -->
    <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.72;0.76;0.93;0.95;0.97;1" dur="10s" repeatCount="indefinite"/>
    <rect x="372" y="820" width="70" height="68" rx="8" fill="none" stroke="#55687f" stroke-width="1.5" stroke-dasharray="7 7"/>
    <path d="M407 838v32M391 854h32" stroke="#7d92ab" stroke-width="3" stroke-linecap="round"/>
    <path d="M444 852H528" stroke="#55687f" stroke-width="1.5" stroke-dasharray="6 8" opacity=".55"/>
  </g>
  <g>
    <!-- 新驱动卡片：渐现（含上浮）→ 保持 → 淡出 -->
    <animateTransform attributeName="transform" type="translate" values="0 16;0 16;0 0;0 0;0 16;0 16" keyTimes="0;0.76;0.84;0.93;0.97;1" dur="10s" repeatCount="indefinite"/>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.76;0.84;0.93;0.97;1" dur="10s" repeatCount="indefinite"/>
      <rect x="640" y="820" width="150" height="64" rx="8" fill="#20203a" stroke="#a678f0" stroke-width="1.5"/>
      <text x="656" y="848" font-size="14" fill="#a78fd8" class="mono">DRV_CanOpen-</text>
      <text x="656" y="872" font-size="18" font-weight="700" fill="#f1eaff" class="mono">Pump</text>
      <rect x="640" y="820" width="150" height="64" rx="8" fill="none" stroke="#dfffc9" stroke-width="2.5">
        <animate attributeName="opacity" values="0;0;.9;.25;0;0" keyTimes="0;0.78;0.815;0.88;0.93;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- 新接线：描边绘制 → 保持 → 收回 -->
    <path d="M528 852H640" fill="none" stroke="#a678f0" stroke-width="2.5" stroke-dasharray="112">
      <animate attributeName="stroke-dashoffset" values="112;112;0;0;112;112" keyTimes="0;0.78;0.845;0.93;0.97;1" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
