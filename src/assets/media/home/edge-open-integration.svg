  <g stroke="#4ed9d0" stroke-width="3" stroke-linecap="round" opacity=".72"><path d="M244 310L548 430"/><path d="M244 590L548 490"/><path d="M1156 310L852 430"/><path d="M1156 590L852 490"/><path d="M700 220v158"/><path d="M700 542v138"/><path d="M416 450h132"/><path d="M852 450h132"/></g>
