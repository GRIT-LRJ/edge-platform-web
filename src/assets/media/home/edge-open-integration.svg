    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061521"/><stop offset="1" stop-color="#091d2c"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#45dbc9" stop-opacity=".26"/><stop offset="1" stop-color="#45dbc9" stop-opacity="0"/></radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173e54"/><stop offset="1" stop-color="#0a2638"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#5bd7df" stroke-opacity=".1"/></pattern>
  </defs>
